<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint - SUT SCMS</title>
</head>
<body>
    <h2>Submit a New Complaint</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <fieldset>
            <legend>Complaint Information</legend>
            {{ complaint_form.as_p }}
        </fieldset>

        <fieldset>
            <legend>Optional Attachment</legend>
            {{ attachment_form.as_p }}
        </fieldset>

        <button type="submit">Submit Complaint</button>
    </form>

    <p><a href="{% url 'profile' %}">Back to Profile</a> | <a href="{% url 'home' %}">Home</a></p>
</body>
</html>
