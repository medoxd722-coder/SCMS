<title>Campus Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout concept: a civic service desk. Public landing page, then a role-based app
   (student / advisor / management) built around queue-complaint stubs as the one bold motif. */
:root{
  --bg:#EDF0F4;          /* cool paper */
  --surface:#FFFFFF;
  --surface-2:#F5F7FA;
  --ink:#0E1A2E;         /* navy ink */
  --muted:#5A667A;
  --line:#D9DFE8;
  --accent:#1F4FD8;      /* cobalt */
  --accent-ink:#FFFFFF;
  --accent-soft:#E3EAFB;
  --complaint:#FFC933;      /* queue-complaint yellow, the single bold element */
  --complaint-ink:#2A2000;
  --ok:#157A4B; --ok-soft:#DDF3E8;
  --warn:#9A5B00; --warn-soft:#FDEBC8;
  --bad:#B42318; --bad-soft:#FBE1DE;
  --info:#1F4FD8; --info-soft:#E3EAFB;
  --shadow:0 1px 2px rgba(14,26,46,.06),0 8px 24px rgba(14,26,46,.06);
  --f-display:'Familjen Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220;--surface:#131C2E;--surface-2:#192339;--ink:#E7ECF5;--muted:#9AA6BB;--line:#26324B;
  --accent:#7B9BFF;--accent-ink:#0B1220;--accent-soft:#1D2A4F;
  --ok:#5ED79B;--ok-soft:#14352A;--warn:#F2B552;--warn-soft:#3A2A0C;--bad:#FF8F85;--bad-soft:#42171A;
  --info:#7B9BFF;--info-soft:#1D2A4F;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220;--surface:#131C2E;--surface-2:#192339;--ink:#E7ECF5;--muted:#9AA6BB;--line:#26324B;
  --accent:#7B9BFF;--accent-ink:#0B1220;--accent-soft:#1D2A4F;
  --ok:#5ED79B;--ok-soft:#14352A;--warn:#F2B552;--warn-soft:#3A2A0C;--bad:#FF8F85;--bad-soft:#42171A;
  --info:#7B9BFF;--info-soft:#1D2A4F;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font:700 19px var(--f-display);color:var(--ink);text-decoration:none;background:none;border:0;padding:0}
.mark{width:34px;height:26px;background:var(--complaint);color:var(--complaint-ink);border-radius:5px;display:grid;place-items:center;font:700 12px var(--f-mono);position:relative}
.mark::before,.mark::after{content:"";position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;background:var(--bg);border-radius:50%}
.mark::before{left:-4px}.mark::after{right:-4px}
.nav{display:flex;gap:4px;margin-left:8px;flex:1;min-width:0;overflow-x:auto}
.nav button,.nav a{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;text-decoration:none}
.nav button:hover,.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.who small{display:block;color:var(--muted);line-height:1.2}
.who b{display:block;line-height:1.2}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 13px var(--f-display)}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:grid;gap:6px;font-weight:600;font-size:13px}
label.f>span small{font-weight:400;color:var(--muted)}
input[type=text],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted)}
.field-err{color:var(--bad);font-size:13px;min-height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-open{background:var(--warn-soft);color:var(--warn)}
.b-review,.b-inprogress,.b-assigned{background:var(--info-soft);color:var(--info)}
.b-replied{background:var(--accent-soft);color:var(--accent)}
.b-solved,.b-resolved,.b-closed{background:var(--ok-soft);color:var(--ok)}.b-submitted{background:var(--warn-soft);color:var(--warn)}.b-underreview{background:var(--info-soft);color:var(--info)}
.b-late{background:var(--bad-soft);color:var(--bad)}

/* landing */
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,68px);font-weight:700;letter-spacing:-.025em}
.hero .lead{font-size:18px;color:var(--muted);max-width:52ch;margin-top:20px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.live{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 20px 12px;margin-top:26px;min-width:0}
.live h2{font-size:16px;margin-bottom:6px}
.live-row{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.live-row:first-of-type{border-top:0}
.live-row p{font-weight:500}
.live-row small{color:var(--muted)}
.stub{position:absolute;right:16px;top:-26px;display:flex;background:var(--complaint);color:var(--complaint-ink);border-radius:8px;transform:rotate(2.5deg);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.stub>div{padding:8px 12px}
.stub .n{font:700 20px var(--f-mono);line-height:1.1}
.stub small{display:block;font-size:11px;font-weight:600;opacity:.75}
.stub .side{border-left:2px dashed rgba(42,32,0,.45);font-size:12px;font-weight:600;line-height:1.3}
.stub::before,.stub::after{content:"";position:absolute;left:calc(var(--cut,64%) - 7px);width:14px;height:14px;border-radius:50%;background:var(--surface)}
.stub::before{top:-7px}.stub::after{bottom:-7px}
.sec{padding-block:64px}
.sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.sec h2.t{font-size:clamp(28px,4vw,42px);font-weight:700;max-width:20ch}
.sec .sub{color:var(--muted);max-width:58ch;margin-top:12px;font-size:16px}
.split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px}
.problems{display:grid;gap:0}
.problems>div{padding:20px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:18px}
.problems>div:first-child{border-top:0;padding-top:0}
.problems h3{font-size:20px;margin-bottom:6px}
.problems p{color:var(--muted)}
.pnum{font:700 13px var(--f-mono);color:var(--bad);background:var(--bad-soft);border-radius:6px;padding:3px 8px;height:fit-content}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:36px}
.flow>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px}
.flow h3{font-size:20px;margin:10px 0 8px}
.flow p{color:var(--muted)}
.flow .ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:32px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.roles>div{padding:24px;border-left:1px solid var(--line)}
.roles>div:first-child{border-left:0}
.roles .lvl{font:700 12px var(--f-mono);color:var(--muted)}
.roles h3{font-size:22px;margin:8px 0}
.roles ul{margin:12px 0 0;padding-left:18px;color:var(--muted)}
.tablebox{overflow-x:auto;margin-top:28px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:14px 16px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.win{background:var(--accent-soft);font-weight:500}
tbody tr:first-child td{border-top:0}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:32px}
.steps>div{border-top:3px solid var(--complaint);padding-top:14px}
.steps h3{font-size:18px;margin:6px 0}
.steps p{color:var(--muted);font-size:14px}
.steps .mono{color:var(--muted)}
.bottom{background:var(--ink);color:var(--bg);border-radius:20px;padding:40px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bottom h2{font-size:clamp(24px,3.4vw,34px);max-width:22ch;color:var(--bg)}
.bottom .btn{border-color:transparent}
footer.ft{padding-block:32px;color:var(--muted);font-size:13px}
footer.ft .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* login */
.login{padding-block:48px}
.login .wrap{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:0;border-radius:20px;overflow:hidden;max-width:1020px;padding:0;box-shadow:var(--shadow);border:1px solid var(--line);margin-inline:auto;background:var(--surface)}
.login aside{background:var(--ink);color:var(--bg);padding:36px;display:grid;gap:18px;align-content:start}
.login aside h2{font-size:30px;color:var(--bg)}
.login aside p,.login aside li{opacity:.8}
.login aside ul{padding-left:18px;margin:0;display:grid;gap:8px}
.login form{padding:36px;display:grid;gap:16px}
.rolepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rolepick label{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:grid;gap:2px;background:var(--surface)}
.rolepick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rolepick label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.rolepick input{position:absolute;opacity:0;pointer-events:none}
.rolepick b{font-family:var(--f-display)}
.rolepick small{color:var(--muted);line-height:1.3}

/* app shell */
.app{padding-block:28px 64px}
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:clamp(26px,3.6vw,36px)}
.pagehead p{color:var(--muted);margin-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.cols.rev{grid-template-columns:340px minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.panel h2{font-size:18px;margin-bottom:12px}
.stack{display:grid;gap:12px}
.side{position:sticky;top:84px;display:grid;gap:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar .grow{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.pills button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

.post{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.vote{display:grid;justify-items:center;gap:2px;min-width:54px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--muted);height:fit-content}
.vote b{font:700 15px var(--f-display);color:var(--ink)}
.vote:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.vote.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vote.on b{color:var(--accent-ink)}
.vote:disabled{cursor:default}
.post h3{font-size:19px;margin:6px 0}
.post .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.post .body{color:var(--muted)}
.post .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.official{margin-top:14px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.official small{display:block;color:var(--muted);margin-bottom:2px}
.thread{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.cm{display:grid;gap:2px;padding:10px 12px;background:var(--surface-2);border-radius:10px}
.cm small{color:var(--muted)}
.cm.staff{background:var(--accent-soft)}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}

.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}

/* complaints */
.tlist{display:grid;gap:8px}
.titem{display:grid;gap:6px;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.titem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.titem .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.titem strong{font-weight:600}
.tracker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:16px 0}
.tracker div{font-size:12px;color:var(--muted);display:grid;gap:6px}
.tracker div::before{content:"";height:6px;border-radius:4px;background:var(--line)}
.tracker div.done{color:var(--ink);font-weight:600}
.tracker div.done::before{background:var(--accent)}
.bubble{max-width:86%;padding:10px 14px;border-radius:14px;background:var(--surface-2);display:grid;gap:2px}
.bubble small{color:var(--muted)}
.bubble.staff{background:var(--accent-soft);justify-self:end}
.route{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--complaint);color:var(--complaint-ink);font-weight:600}
.route small{display:block;font-weight:500;opacity:.8}
.sugg{border:1px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:14px;display:grid;gap:10px}
.sugg h3{font-size:15px;color:var(--ok)}
.sugg article{background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;gap:6px}

/* archive */
details.ans{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0}
details.ans summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;gap:6px}
details.ans summary::-webkit-details-marker{display:none}
details.ans summary h3{font-size:18px}
details.ans[open] summary{border-bottom:1px solid var(--line)}
details.ans .in{padding:16px 18px;display:grid;gap:14px}
details.ans ol{margin:0;padding-left:20px;display:grid;gap:6px}
.ans .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi small{color:var(--muted);display:block}
.kpi b{display:block;font:700 32px var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
.bars{display:grid;gap:14px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 62px;gap:12px;align-items:center;font-size:13px}
.bar .tr{position:relative;height:14px;background:var(--surface-2);border-radius:7px}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent)}
.bar .fill.late{background:var(--bad)}
.bar .sla{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:50%}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.axis{display:grid;grid-template-columns:130px minmax(0,1fr) 62px;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.axis div{position:relative;height:16px}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.stack-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.stack-bar i{display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tablebox.flat{margin-top:0;border:0}
td .sel{padding:6px 8px;font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow)}

.uni{background:var(--ink);color:var(--bg);font-size:12px}
.uni .wrap{display:flex;gap:6px 18px;justify-content:space-between;flex-wrap:wrap;padding-block:6px}
.uni span{opacity:.85}
.brand span.bt{display:block;text-align:left}
.brand b{display:block;font:700 16px var(--f-display);line-height:1.1}
.brand small{display:block;font:500 11px var(--f-body);color:var(--muted);line-height:1.2;margin-top:2px}
.crest{display:block;flex:none}
.bellw{position:relative}
.bellw .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;pointer-events:none}
.notif{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:70}

  if(open)h+='<div class="notif" role="region" aria-label="Notifications">'+(n.length?n.slice(0,6).map(function(x){return '<button class="n" data-act="notif" data-go="'+x.go+'" data-id="'+esc(x.id||'')+'" data-post="'+esc(x.post||'')+'"><span>'+esc(x.t)+'</span><br><small class="muted">'+ago(x.ts)+(x.ts>(S.ui.prevSeen||0)?' · new':'')+'</small></button>'}).join(''):'<p class="muted" style="padding:10px">You are all caught up.</p>')+'</div>';

/* ---------- portal home ---------- */
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}

  return cal.map(function(c){var d=new Date(Date.now()+c[0]*864e5);return '<div class="date'+(c[0]<=5?' soon':'')+'"><div class="d"><b>'+d.getDate()+'</b><small>'+d.toLocaleDateString('en-GB',{month:'short'})+'</small></div><div><b>'+c[1]+'</b><br><span class="muted" style="font-size:13px">In '+c[0]+' days</span></div></div>'}).join('');

function pRow(p){return '<button class="item" data-act="gotopost" data-id="'+p.id+'"><div><b>'+esc(p.title)+'</b><br><span class="muted" style="font-size:13px">'+esc(C[p.cat].n)+' · '+ST[p.status]+'</span></div><span class="vote" style="pointer-events:none">'+IC.up+'<b>'+tv(p)+'</b></span></button>'}
function kpi(l,v,s){return '<div class="kpi"><small>'+l+'</small><b>'+v+'</b><span>'+s+'</span></div>'}
function vHome(){var u=S.user;return '<div class="wrap app">'+(u.role==='student'?homeStudent():u.role==='advisor'?homeAdvisor():homeMgr())+'</div>'}
function homeStudent(){

    '<div class="idcard"><div class="band">'+crest(18)+UNI.name+'</div><div class="gold"></div><div class="bd"><div class="photo" aria-hidden="true">'+esc(initials(u.name))+'</div><div><b>'+esc(u.name)+'</b><small>ID '+esc(u.id)+'<br>'+esc(u.program)+'<br>Valid '+UNI.year+'</small></div></div><div class="code" aria-hidden="true"></div></div></section>'+

function homeAdvisor(){
  var u=S.user,all=D().complaints.filter(function(t){return t.dept===u.dept}),need=all.filter(needsReply).sort(function(a,b){return (b.priority==='urgent')-(a.priority==='urgent')||a.created-b.created});
  var prog=all.filter(function(t){return !isResolved(t)&&!needsReply(t)}).length,s30=all.filter(function(t){return t.solvedAt&&Date.now()-t.solvedAt<30*24*H}).length;
  var fr=avg(all.filter(function(t){return t.firstResponse}).map(function(t){return (t.firstResponse-t.created)/H}));
  var tp=D().posts.filter(function(p){return C[p.cat].d===u.dept}).sort(function(a,b){return tv(b)-tv(a)}).slice(0,3);
  return '<section class="panel welcome" style="grid-template-columns:minmax(0,1fr)"><div><h1>'+greet()+', '+esc(u.name.replace(/^(Dr|Eng|Mr|Ms|Prof)\.\s*/,'').split(' ')[0])+'</h1><p class="muted" style="margin-top:8px">'+DEPTS[u.dept].n+' · Staff ID '+esc(u.id)+'</p><div class="cta-row"><button class="btn primary" data-act="nav" data-v="inbox">Open complaint inbox</button><button class="btn" data-act="nav" data-v="forum">Reply on the forum</button></div></div></section>'+
  '<div class="kpis in">'+kpi('Waiting for your reply',need.length,'target first reply '+SLA+' h')+kpi('Waiting on student',prog,'in progress')+kpi('Resolved in 30 days',s30,'department total')+kpi('Average first reply',fmtH(fr),fr!=null&&fr>SLA?'over target':'within target')+'</div>'+
  '<div class="homegrid"><section class="panel hg-8"><div class="head"><h2>Waiting for your reply</h2><button class="linkbtn" data-act="nav" data-v="inbox">Open inbox</button></div>'+(need.length?need.slice(0,5).map(function(t){return tRow(t,'inbox')}).join(''):'<div class="empty"><b>All caught up</b>No student is waiting for a reply in your department.</div>')+'</section>'+
  '<section class="panel hg-4"><h2>Key dates</h2>'+datesHTML()+'</section>'+
  '<section class="panel hg-8"><div class="head"><h2>Top issues in your department</h2><button class="linkbtn" data-act="nav" data-v="forum">Open forum</button></div>'+(tp.length?tp.map(pRow).join(''):'<p class="muted">No forum issues for your department.</p>')+'</section>'+
  '<section class="panel hg-4"><h2>Announcements</h2>'+annHTML(2)+'</section></div>';
}
function homeMgr(){
  var T=D().complaints,P=D().posts,open=T.filter(function(t){return !isResolved(t)}).length;
  var fr=avg(T.filter(function(t){return t.firstResponse}).map(function(t){return (t.firstResponse-t.created)/H}));
  var unans=P.filter(function(p){return tv(p)>=150&&!p.official}).sort(function(a,b){return tv(b)-tv(a)});
  var slow=Object.keys(DEPTS).map(function(k){var r=T.filter(function(t){return t.dept===k&&t.firstResponse}).map(function(t){return (t.firstResponse-t.created)/H});return {n:DEPTS[k].n,a:avg(r)}}).filter(function(d){return d.a!=null&&d.a>SLA}).sort(function(a,b){return b.a-a.a});
  var maxv=Math.max.apply(null,P.map(tv));
  return '<section class="panel welcome" style="grid-template-columns:minmax(0,1fr)"><div><h1>'+greet()+', '+esc(MGR.name.replace(/^Prof\.\s*/,'Prof. ').split(' ').slice(0,2).join(' '))+'</h1><p class="muted" style="margin-top:8px">'+MGR.title+' · '+UNI.name+'</p><div class="cta-row"><button class="btn primary" data-act="nav" data-v="dash">Open the dashboard</button><button class="btn" data-act="nav" data-v="forum">Review the forum</button></div></div></section>'+
  '<div class="kpis in">'+kpi('Open complaints',open,'across '+Object.keys(DEPTS).length+' departments')+kpi('Average first reply',fmtH(fr),'target '+SLA+' h')+kpi('Top issue votes',maxv,'students behind one problem')+kpi('Issues without a reply',unans.length,'150 votes or more')+'</div>'+
  '<div class="homegrid"><section class="panel hg-8"><h2>Needs your attention</h2>'+
    (unans.length?unans.slice(0,3).map(pRow).join(''):'')+
    slow.map(function(d){return '<div class="item"><div><b>'+d.n+' is slow to reply</b><br><span class="muted" style="font-size:13px">Average first reply '+fmtH(d.a)+', target '+SLA+' h</span></div><span class="badge b-late">Over target</span></div>'}).join('')+
    (!unans.length&&!slow.length?'<div class="empty"><b>Nothing urgent</b>Every big issue has a reply and every department is within target.</div>':'')+'</section>'+
  '<form class="panel hg-4 stack" data-form="ann"><h2>Post an announcement</h2><label class="f"><span>Topic</span><select id="an-tag" data-bind="anntag">'+['General','Registration','Exams','Fees','IT','Facilities'].map(function(x){return '<option'+(dr('anntag','General')===x?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label><label class="f"><span>Title</span><input type="text" id="an-t" data-bind="annt" value="'+esc(dr('annt'))+'" placeholder="Short and specific"></label><label class="f"><span>Message</span><textarea id="an-b" data-bind="annb" placeholder="What students need to know and do">'+esc(dr('annb'))+'</textarea></label><div class="field-err" id="an-err" role="alert"></div><button class="btn primary" type="submit">Publish to all students</button></form>'+
  '<section class="panel hg-8"><h2>Announcements</h2>'+annHTML(4)+'</section>'+
  '<section class="panel hg-4"><h2>Key dates</h2>'+datesHTML()+'</section></div>';
}

/* ---------- forum ---------- */
function forumListHTML(){
  var q=dr('fq').toLowerCase(),u=S.user;
  var list=D().posts.filter(function(p){return (!S.ui.fcat||p.cat===S.ui.fcat)&&(!S.ui.ffac||p.fac===S.ui.ffac)&&(!q||(p.title+' '+p.body).toLowerCase().indexOf(q)>-1)});
  list.sort(function(a,b){return S.ui.fsort==='top'?tv(b)-tv(a):b.ts-a.ts});
  if(!list.length)return '<div class="empty"><b>No posts match</b>Try another search or category, or post this problem yourself.</div>';
  return list.map(function(p){return postHTML(p,u)}).join('');
}
function postHTML(p,u){

/* ---------- archive ---------- */
function matchArchive(q,minimal){
  var t=q.toLowerCase().split(/[^a-z0-9]+/).filter(function(w){return w.length>2});
  var list=D().archive.slice();
  if(S.ui.arcCat&&!minimal)list=list.filter(function(a){return a.cat===S.ui.arcCat});
  if(!t.length)return minimal?[]:list.sort(function(a,b){return b.helpful-a.helpful});
  return list.map(function(a){var hay=(a.title+' '+a.answer.join(' ')+' '+C[a.cat].n).toLowerCase(),s=0;
    t.forEach(function(w){if(hay.indexOf(w)>-1)s++;if(a.title.toLowerCase().indexOf(w)>-1)s+=2});return {a:a,s:s}})
    .filter(function(x){return x.s>0}).sort(function(x,y){return y.s-x.s||y.a.helpful-x.a.helpful}).map(function(x){return x.a});
}

  var list=matchArchive(dr('aq'));

    var did=S.ui.helped[a.id];
    return '<details class="ans"><summary><div class="row">'+catChip(a.cat)+'<span>'+DEPTS[a.dept].n+'</span><span>·</span><span>Solved '+ago(a.ts)+'</span></div><h3>'+esc(a.title)+'</h3><span class="muted" style="font-size:13px">'+a.helpful+' students fixed this themselves</span></summary><div class="in"><ol>'+a.answer.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol><div class="row"><span>Answer by '+esc(a.by)+'</span>'+
      (S.user.role==='student'?'<button class="btn sm'+(did?'':' primary')+'" data-act="helpful" data-id="'+a.id+'"'+(did?' disabled':'')+'>'+(did?'Thanks for confirming':'This fixed my problem')+'</button>':'')+'</div></div></details>';
  }).join('');
}

function statusOptions(selected){return TICKET_STATES.map(function(s){return '<option value=\"'+s+'\"'+(selected===s?' selected':'')+'>'+TICKET_ST[s]+'</option>'}).join('')}

/* ---------- dashboard ---------- */
function avg(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function fmtH(h){return h==null?'n/a':(h<10?h.toFixed(1):Math.round(h))+' h'}
function facTable(){var T=D().complaints,P=D().posts;
 return '<div class="panel" style="margin-top:20px"><h2>By faculty</h2><div class="tablebox flat"><table><thead><tr><th>Faculty</th><th class="num">Complaints</th><th class="num">Open</th><th class="num">Forum posts</th><th class="num">Top issue votes</th><th class="num">Avg first reply</th></tr></thead><tbody>'+FACS.map(function(f){var ts=T.filter(function(t){return t.fac===f.id}),ps=P.filter(function(p){return p.fac===f.id});var r=ts.filter(function(t){return t.firstResponse}).map(function(t){return (t.firstResponse-t.created)/H});return '<tr><td><b>Faculty of '+f.n+'</b></td><td class="num">'+ts.length+'</td><td class="num">'+ts.filter(function(t){return !isResolved(t)}).length+'</td><td class="num">'+ps.length+'</td><td class="num">'+(ps.length?Math.max.apply(null,ps.map(tv)):0)+'</td><td class="num">'+fmtH(avg(r))+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
function vDash(){
  var fq=S.ui.dfac||'',T=D().complaints.filter(function(t){return !fq||t.fac===fq}),P=D().posts.filter(function(p){return !fq||p.fac===fq}),A=D().archive;
  var frs=T.filter(function(t){return t.firstResponse}).map(function(t){return (t.firstResponse-t.created)/H});
  var open=T.filter(function(t){return !isResolved(t)}).length;
  var solved30=T.filter(function(t){return t.solvedAt&&Date.now()-t.solvedAt<30*24*H}).length;
  var deflect=A.reduce(function(s,a){return s+a.helpful},0);
  var depts=Object.keys(DEPTS).map(function(k){var ts=T.filter(function(t){return t.dept===k});var r=ts.filter(function(t){return t.firstResponse}).map(function(t){return (t.firstResponse-t.created)/H});
    return {k:k,n:DEPTS[k].n,total:ts.length,open:ts.filter(function(t){return !isResolved(t)}).length,avg:avg(r)}}).sort(function(a,b){return (b.avg||0)-(a.avg||0)});
  var staff=[];Object.keys(DEPTS).forEach(function(k){DEPTS[k].staff.forEach(function(n){var ts=T.filter(function(t){return t.assignee===n});var r=ts.filter(function(t){return t.firstResponse}).map(function(t){return (t.firstResponse-t.created)/H});
    staff.push({n:n,d:DEPTS[k].n,handled:ts.length,solved:ts.filter(function(t){return isResolved(t)}).length,avg:avg(r)})})});
  staff.sort(function(a,b){return (b.avg||0)-(a.avg||0)});
  var top=P.slice().sort(function(a,b){return tv(b)-tv(a)}).slice(0,6);
  var cats=CATS.map(function(c){var ts=T.filter(function(t){return t.cat===c.id});return {n:c.n,open:ts.filter(function(t){return !isResolved(t)}).length,solved:ts.filter(function(t){return isResolved(t)}).length}});
  var maxC=Math.max.apply(null,cats.map(function(c){return c.open+c.solved}))||1;

  var h='<div class="wrap app"><div class="pagehead"><div><h1>Higher access dashboard</h1><p>What students are upvoting, and which departments are slow to respond.</p></div><label class="f" style="min-width:220px"><span>Faculty</span><select id="dfac" data-chg="dfac"><option value="">All faculties</option>'+FACS.map(function(f){return '<option value="'+f.id+'"'+(fq===f.id?' selected':'')+'>Faculty of '+f.n+'</option>'}).join('')+'</select></label></div>'+
   '<div class="kpis"><div class="kpi"><small>Open complaints</small><b>'+open+'</b><span>of '+T.length+' this term</span></div><div class="kpi"><small>Average first reply</small><b>'+fmtH(avg(frs))+'</b><span>Target '+SLA+' h</span></div><div class="kpi"><small>Resolved in 30 days</small><b>'+solved30+'</b><span>complaints closed</span></div><div class="kpi"><small>Fixed from the archive</small><b>'+deflect+'</b><span>questions that never became complaints</span></div></div>'+
   '<div class="panel"><h2>Top upvoted issues</h2><div class="tablebox flat"><table><thead><tr><th class="num">Votes</th><th>Issue</th><th>Owner</th><th>Status</th><th>Update</th></tr></thead><tbody>'+
   top.map(function(p){return '<tr><td class="num"><b>'+tv(p)+'</b></td><td style="min-width:240px"><b>'+esc(p.title)+'</b><br><span class="muted" style="font-size:13px">'+esc(C[p.cat].n)+' · '+ago(p.ts)+'</span></td><td>'+DEPTS[C[p.cat].d].n+'</td><td>'+badge(p.status)+'</td><td><select class="sel" data-chg="poststatus" data-id="'+p.id+'" aria-label="Set status for '+esc(p.title)+'" style="width:auto">'+['open','review','replied','solved'].map(function(s){return '<option value="'+s+'"'+(p.status===s?' selected':'')+'>'+ST[s]+'</option>'}).join('')+'</select></td></tr>'}).join('')+
   '</tbody></table></div></div>'+
   '<div class="grid2"><div class="panel"><h2>First reply time by department</h2><div class="bars">'+depts.map(function(d){var w=d.avg==null?0:Math.min(d.avg/48*100,100);return '<div class="bar"><span>'+d.n+'</span><div class="tr"><div class="fill'+(d.avg>SLA?' late':'')+'" style="width:'+w+'%"></div><div class="sla"></div></div><span class="v">'+fmtH(d.avg)+'</span></div>'}).join('')+'</div>'+
     '<div class="axis"><span></span><div><span style="left:0;transform:none">0 h</span><span style="left:50%">'+SLA+' h target</span><span style="left:100%;transform:translateX(-100%)">48 h</span></div><span></span></div></div>'+
   '<div class="panel"><h2>Complaints by category</h2><div class="legend"><span><i style="background:var(--warn)"></i>Open</span><span><i style="background:var(--ok)"></i>Solved</span></div><div class="bars">'+cats.map(function(c){return '<div class="bar"><span>'+c.n+'</span><div class="stack-bar" style="width:'+((c.open+c.solved)/maxC*100)+'%;min-width:8px"><i style="background:var(--warn);width:'+(c.open/((c.open+c.solved)||1)*100)+'%"></i><i style="background:var(--ok);flex:1"></i></div><span class="v">'+(c.open+c.solved)+'</span></div>'}).join('')+'</div></div></div>'+
   facTable()+'<div class="panel" style="margin-top:20px"><h2>Staff speed</h2><div class="tablebox flat"><table><thead><tr><th>Staff</th><th>Department</th><th class="num">Handled</th><th class="num">Solved</th><th class="num">Avg first reply</th></tr></thead><tbody>'+
   staff.map(function(s){return '<tr><td><b>'+esc(s.n)+'</b></td><td>'+s.d+'</td><td class="num">'+s.handled+'</td><td class="num">'+s.solved+'</td><td class="num">'+(s.avg!=null&&s.avg>SLA?'<span class="badge b-late">'+fmtH(s.avg)+'</span>':fmtH(s.avg))+'</td></tr>'}).join('')+'</tbody></table></div></div></div>';
  return h;
}

/* ---------- render ---------- */
function render(){
  var u=S.user,v=S.view,body;
  if(v!=='landing'&&v!=='login'&&!u){v='landing';S.view=v}
  if(v==='home')body=vHome();
  else if(v==='landing')body=vLanding();
  else if(v==='login')body=vLogin();
  else if(v==='forum')body=vForum();
  else if(v==='complaints')body=vComplaints();
  else if(v==='newcomplaint')body=vNewComplaint();
  else if(v==='archive')body=vArchive();
  else if(v==='inbox')body=vInbox();
  else if(v==='dash')body=vDash();
  else body=vLanding();
  $('#app').innerHTML=uniBar()+header()+'<main>'+body+'</main>'+footer();
  save();
}

/* ---------- actions ---------- */
var A={
  nav:function(d){if(d.v==='landing'&&S.user){go(home(S.user.role));return}go(d.v)},
  scroll:function(d){var el=document.getElementById(d.t);if(el)el.scrollIntoView({behavior:'smooth'})},
  bell:function(){if(!S.ui.bell){S.ui.prevSeen=S.seen;S.seen=Date.now()}S.ui.bell=!S.ui.bell;render()},
  notif:function(d){S.ui.bell=false;if(d.go==='forum')go('forum',{openPost:d.post||null});else go(d.go,{openComplaint:d.id||null,ifilter:'all'})},
  gotocomplaint:function(d){go(d.v,{openComplaint:d.id,ifilter:'all'})},
  gotopost:function(d){go('forum',{openPost:d.id,fcat:'',ffac:'',fsort:'top'})},
  logout:function(){S.ui.bell=false;S.user=null;S.ui.draft={};go('landing');toast('Signed out')},
  demovote:function(d){S.ui.demoVotes[d.id]=!S.ui.demoVotes[d.id];var y=window.scrollY;render();window.scrollTo(0,y)},
  vote:function(d){var p=D().posts.filter(function(x){return x.id===d.id})[0];var i=p.voters.indexOf(S.user.id);if(i>-1)p.voters.splice(i,1);else p.voters.push(S.user.id);keep(function(){render()})},
  togglepost:function(d){S.ui.openPost=S.ui.openPost===d.id?null:d.id;keep(render)},
  fsort:function(d){S.ui.fsort=d.v;keep(render)},
  fcat:function(d){S.ui.fcat=d.v;keep(render)},
  acat:function(d){S.ui.arcCat=d.v;keep(render)},
  ifilter:function(d){S.ui.ifilter=d.v;S.ui.openComplaint=null;render()},
  opencomplaint:function(d){S.ui.openComplaint=d.id;keep(render)},
  comment:function(d){var t=dr('cm_'+d.id).trim();if(!t)return toast('Write a comment first');var p=D().posts.filter(function(x){return x.id===d.id})[0];
    p.comments.push({by:S.user.name,role:S.user.role,text:t,ts:Date.now()});S.ui.draft['cm_'+d.id]='';keep(render);toast('Comment added')},
  official:function(d){var p=D().posts.filter(function(x){return x.id===d.id})[0];var t=dr('of_'+d.id,p.official?p.official.text:'').trim();var st=dr('ps_'+d.id,p.status);
    if(!t)return toast('Write the official reply first');
    p.official={by:S.user.name+' ('+(S.user.role==='advisor'?DEPTS[S.user.dept].n:'Management')+')',text:t,ts:Date.now()};p.status=st==='open'?'replied':st;
    keep(render);toast('Official reply published')},
  studentreply:function(d){var t=dr('tr_'+d.id).trim();if(!t)return toast('Write a reply first');var k=tk(d.id);k.messages.push({from:'student',name:S.user.name,text:t,ts:Date.now()});S.ui.draft['tr_'+d.id]='';keep(render);toast('Reply sent')},
  staffreply:function(d){var t=dr('sr_'+d.id).trim();if(!t)return toast('Write a reply first');var k=tk(d.id);
    k.messages.push({from:'staff',name:S.user.name,text:t,ts:Date.now()});if(!k.firstResponse)k.firstResponse=Date.now();k.status='inprogress';S.ui.draft['sr_'+d.id]='';keep(render);toast('Reply sent to student')},
  deleteticket:function(d){if(!confirm('Delete this complaint permanently from the demo?'))return;S.data.complaints=S.data.complaints.filter(function(t){return t.id!==d.id});S.ui.openComplaint=null;keep(render);toast('Complaint deleted')}, solve:function(d){var k=tk(d.id);var ans=dr('fa_'+d.id,'').trim();var save=$('#fa-save').checked;
    if(save&&!ans){$('#fa-err').textContent='Add the final answer, or untick "Save this answer".';return}
    k.status='resolved';k.solvedAt=Date.now();if(!k.firstResponse)k.firstResponse=Date.now();k.messages.push({from:'staff',name:S.user.name,text:'Marked as resolved.'+(ans?' '+ans.split('\n')[0]:''),ts:Date.now()});
    if(save){D().archive.unshift({id:'a'+Date.now(),cat:k.cat,dept:k.dept,title:k.title,answer:ans.split('\n').map(function(s){return s.trim()}).filter(Boolean),by:S.user.name,ts:Date.now(),helpful:0})}
    keep(render);toast(save?'Solved and saved to the archive':'Complaint marked resolved')},
  reopen:function(d){var k=tk(d.id);k.status='inprogress';k.solvedAt=null;k.messages.push({from:'student',name:S.user.name,text:'Reopened: the problem is still happening.',ts:Date.now()});keep(render);toast('Complaint reopened')},
  helpful:function(d){if(S.ui.helped[d.id])return;S.ui.helped[d.id]=true;D().archive.filter(function(a){return a.id===d.id})[0].helpful++;keep(render);toast('Thanks. That helps the next student too')},
  solvedme:function(d){D().archive.filter(function(a){return a.id===d.id})[0].helpful++;S.ui.draft.ntitle='';S.ui.draft.nbody='';toast('Great, no complaint needed');go('archive')}
};
function tk(id){return D().complaints.filter(function(t){return t.id===id})[0]}
/* keep scroll position across re-render */
function keep(fn){var y=window.scrollY,open=document.activeElement&&document.activeElement.id;fn();window.scrollTo(0,y)}

var CH={
  ffac:function(d,v){S.ui.ffac=v;keep(render)},
  dfac:function(d,v){S.ui.dfac=v;keep(render)},
  assign:function(d,v){var k=tk(d.id);k.assignee=v;keep(render);toast('Assigned to '+v)}, complaintstatus:function(d,v){var k=tk(d.id);k.status=v;if(v==='resolved'||v==='closed')k.solvedAt=Date.now();else k.solvedAt=null;keep(render);toast('Status set to '+TICKET_ST[v])}, complaintdept:function(d,v){var k=tk(d.id);k.dept=v;k.assignee=nextStaff(v);keep(render);toast('Department changed to '+DEPTS[v].n)},
  poststatus:function(d,v){var p=D().posts.filter(function(x){return x.id===d.id})[0];p.status=v;keep(render);toast('Status set to '+ST[v])}
};
var L={
  attach:function(){var n=(dr('nfile')||'').split(/[\\/]/).pop();S.ui.draft.nfile=n;$('#attname').textContent=n?'Attached: '+n:''},
  rerender:function(){render()},
  forum:function(){$('#flist').innerHTML=forumListHTML()},
  archive:function(){$('#alist').innerHTML=archiveListHTML()},
  suggest:function(){$('#sugg').innerHTML=suggestHTML()},
  routing:function(){$('#route').innerHTML=routeHTML(dr('ncat','grades'))}
};
var F={
  login:function(){
    var role=dr('role','student'),idv=($('#lg-id').value||'').trim(),pw=($('#lg-pw').value||''),err=$('#lg-err');
    if(idv.length<3){err.textContent='Enter your '+(role==='student'?'student':'staff')+' ID (at least 3 characters).';$('#lg-id').focus();return}
    if(!pw){err.textContent='Enter your password. Any password works in this demo. Choose Higher access to manage the whole system.';$('#lg-pw').focus();return}
    if(role==='student'){
      if(idv===STUDENT.id&&dr('fac','eng')==='eng')S.user=Object.assign({role:'student'},STUDENT);
      else{var fc=dr('fac','eng');S.user={role:'student',id:idv,name:idv===STUDENT.id?STUDENT.name:'Student '+idv,fac:fc,program:FC[fc].n+' program',level:'Year 2',advisor:DEPTS.advising.staff[0],email:'s'+idv+'@student.ntu.example.edu'}}
    }
    else if(role==='advisor'){var dp=dr('dept','registrar');S.user={role:'advisor',id:idv,dept:dp,name:DEPTS[dp].staff[0]}}
    else S.user={role:'mgr',id:idv,name:MGR.name};
    S.seen=Date.now()-48*H;S.ui.bell=false;S.ui.openComplaint=null;S.ui.ifilter='need';S.ui.draft={};go('home');toast('Signed in as '+S.user.name);
  },
  post:function(){var t=dr('ptitle').trim(),b=dr('pbody').trim(),e=$('#post-err');
    if(t.length<8){e.textContent='Give the problem a title of at least 8 characters.';$('#pt').focus();return}
    if(b.length<10){e.textContent='Add a few details so staff can act on it.';$('#pb').focus();return}
    D().posts.unshift({id:'p'+(D().nextPost++),cat:dr('pcat','grades'),title:t,body:b,votes:0,voters:[S.user.id],status:'open',ts:Date.now(),author:'You',fac:S.user.fac||'eng',comments:[],official:null});
    S.ui.draft.ptitle='';S.ui.draft.pbody='';S.ui.fsort='new';S.ui.fcat='';S.ui.fq='';S.ui.draft.fq='';render();toast('Posted to the forum')},
  complaint:function(){var t=dr('ntitle').trim(),b=dr('nbody').trim(),e=$('#t-err');
    if(t.length<6){e.textContent='Add a subject of at least 6 characters.';$('#nt').focus();return}
    if(b.length<10){e.textContent='Add details so the advisor can help without asking again.';$('#nb').focus();return}
    var cat=dr('ncat','grades'),d=C[cat].d,id='CD-'+(D().nextComplaint++),now=Date.now();
    D().complaints.push({id:id,title:t,cat:cat,dept:d,fac:S.user.fac,courseName:dr('ncourseName').trim(),course:dr('ncourse').trim().toUpperCase(),priority:dr('nprio','normal'),attachment:dr('nfile'),studentId:S.user.id,studentName:S.user.name,assignee:nextStaff(d),status:'submitted',created:now,firstResponse:null,solvedAt:null,messages:[{from:'student',name:S.user.name,text:b,ts:now}]});
    ['ntitle','nbody','ncourseName','ncourse','nfile'].forEach(function(k){S.ui.draft[k]=''});S.ui.draft.nprio='normal';S.ui.openComplaint=id;go('complaints');toast('Complaint '+id+' submitted to '+DEPTS[d].n)},
  ann:function(){var t=dr('annt').trim(),b=dr('annb').trim(),e=$('#an-err');
    if(t.length<6){e.textContent='Add a title of at least 6 characters.';$('#an-t').focus();return}
    if(b.length<10){e.textContent='Add a message students can act on.';$('#an-b').focus();return}
    D().announcements.unshift({id:'n'+Date.now(),tag:dr('anntag','General'),title:t,body:b,by:MGR.title,ts:Date.now()});S.ui.draft.annt='';S.ui.draft.annb='';render();toast('Announcement published')}

};

document.addEventListener('click',function(e){if(S.ui.bell&&!e.target.closest('.bellw')){S.ui.bell=false;render()}var el=e.target.closest('[data-act]');if(!el||el.disabled)return;var h=A[el.dataset.act];if(h){if(el.tagName==='A'||el.type==='submit')e.preventDefault();h(el.dataset,el)}});
document.addEventListener('input',function(e){var el=e.target;if(!el.dataset||!el.dataset.bind)return;S.ui.draft[el.dataset.bind]=el.value;var l=el.dataset.live;if(l&&L[l])L[l]()});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset&&el.dataset.chg&&CH[el.dataset.chg])CH[el.dataset.chg](el.dataset,el.value)});
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();F[f.dataset.form]()});

render();
})();
</script>
